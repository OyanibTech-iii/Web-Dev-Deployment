# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    images_directory: '%kernel.project_dir%/public/uploads/images'
    course_images_directory: '%kernel.project_dir%/public/uploads/courses'
    lesson_content_directory: '%kernel.project_dir%/public/uploads/lessons'
    env(REDIS_URL): 'redis://redis:6379/0'
    env(REDIS_CACHE_URL): 'redis://redis:6379/2'
    env(REDIS_RATE_LIMITER_URL): 'redis://redis:6379/1'
    env(REDIS_SESSION_URL): 'redis://redis:6379/2'
    env(GEMINI_MODEL): 'gemini-2.5-flash'
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    gemini_model: '%env(GEMINI_MODEL)%'
    stripe_public_key: '%env(PUBLISHABLE_KEY)%'
    stripe_secret_key: '%env(PRIVATE_KEY)%'
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    test_card: '%env(TEST_CARD)%'
    chat_ws_url: '%env(default:CHAT_WS_URL:CHAT_WS_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $geminiModel: '%env(GEMINI_MODEL)%'
            $stripePublicKey: '%stripe_public_key%'
            $stripeWebhookSecret: '%stripe_webhook_secret%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Tests,Kernel.php}'

    App\Controller\:
        resource: '../src/Controller/'
        tags: [ 'controller.service_arguments' ]

    Predis\Client:
        arguments:
            - '%env(REDIS_URL)%'

    # Redis for Session using Predis
    session.redis:
        class: Predis\Client
        arguments:
            - '%env(REDIS_SESSION_URL)%'

    app.session_handler.redis:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        arguments:
            - '@session.redis'
