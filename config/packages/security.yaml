security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_platform:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: App\Security\JWTAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\LoginFormAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            custom_authenticators:
              - App\Security\LoginFormAuthenticator
              - App\Security\GoogleAuthenticator
            user_checker: App\Security\UserChecker
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            logout:
                path: app_logout
                target: app_landinpage
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            # Easy way to control access for large sections of your site
            # Note: Only the *first* access control that matches will be used
    access_control:
      #api routes (no authentication required)
      - { path: ^/api/register, roles: PUBLIC_ACCESS }
      - { path: ^/api/login, roles: PUBLIC_ACCESS }
      - { path: ^/api/uploads, roles: PUBLIC_ACCESS }
      - { path: ^/api, roles: IS_AUTHENTICATED }

      # Public routes (no authentication required)
      - { path: ^/$, roles: PUBLIC_ACCESS }
      - { path: ^/about, roles: PUBLIC_ACCESS }
      - { path: ^/contact, roles: PUBLIC_ACCESS }
      - { path: ^/products, roles: PUBLIC_ACCESS }
      - { path: ^/login, roles: PUBLIC_ACCESS }
      - { path: ^/register, roles: PUBLIC_ACCESS }
      - { path: ^/verify/email, roles: PUBLIC_ACCESS }
      - { path: ^/terms, roles: PUBLIC_ACCESS }
      - { path: ^/privaypolicy, roles: PUBLIC_ACCESS }
      - { path: ^/footer, roles: PUBLIC_ACCESS }
      - { path: ^/verify-email, roles: PUBLIC_ACCESS }
      - { path: ^/card, roles: PUBLIC_ACCESS }
      - { path: ^/help, roles: PUBLIC_ACCESS }
      - { path: ^/webhooks/stripe, roles: PUBLIC_ACCESS }

      # Admin routes (admin role required)
      - { path: ^/admin/logs, roles: ROLE_ADMIN }
      - { path: ^/admin, roles: ROLE_ADMIN }

      # Protected routes (user authentication required)
      - { path: ^/dashboard, roles: ROLE_USER }
      - { path: ^/userpage, roles: ROLE_USER }
      - { path: ^/product($|/), roles: ROLE_USER }
      - { path: ^/stock, roles: ROLE_USER }
      - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
